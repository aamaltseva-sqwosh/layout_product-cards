<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Product cards</title>
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin="anonymous"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="./styles/index.scss"
    />
  </head>
  <body>
    <section
      class="product"
      data-qa="card"
    >
      <img
        class="product__image"
        src="../src/images/imac.jpeg"
        alt="imac"
      />

      <h2 class="product__name">
        APPLE A1419 iMac 27" Retina
        <br />
        5K Monoblock (MNED2UA/A)
      </h2>

      <h3 class="product__code">Product code: 195434</h3>

      <div class="reviews">
        <div class="reviews__stars">
          <div class="star"></div>
          <div class="star"></div>
          <div class="star"></div>
          <div class="star"></div>
          <div class="star"></div>
        </div>

        <h3 class="reviews__count">Reviews: 5</h3>
      </div>

      <div class="price">
        <h3 class="price__text">Price:</h3>
        <h3 class="price__count">$2,199</h3>
      </div>

      <button
        class="product__button"
        data-qa="hover"
      >
        buy
      </button>
    </section>
  </body>
</html>
